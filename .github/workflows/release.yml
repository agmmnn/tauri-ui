name: Release

on:
  push:
    branches:
      - master
    paths:
      - ".changeset/**"
      - ".github/workflows/release.yml"
      - "package.json"
      - "bun.lock"
      - "scripts/**"
      - "packages/create-tauri-ui/**"

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release-state:
    name: Detect release commit
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.version.outputs.is_release }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare package version
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          current_version="$(jq -r .version packages/create-tauri-ui/package.json)"
          previous_version="$(git show "${BEFORE_SHA}:packages/create-tauri-ui/package.json" 2>/dev/null | jq -r .version || true)"

          echo "version=$current_version" >> "$GITHUB_OUTPUT"
          if [ -n "$previous_version" ] && [ "$current_version" != "$previous_version" ]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

  prepublish-smoke:
    name: Native smoke (${{ matrix.name }})
    needs: release-state
    if: needs.release-state.outputs.is_release == 'true'
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows installers
            artifact_group: windows-installers
            platform: windows-latest
            rust_targets: ""
            build_args: '["--bundles","nsis,msi"]'
            expected_artifacts: '["src-tauri/target/release/bundle/nsis/*.exe","src-tauri/target/release/bundle/msi/*.msi"]'
            artifact_names: '["tauri-ui-smoke-v__VERSION__-windows-x64.exe","tauri-ui-smoke-v__VERSION__-windows-x64.msi"]'
            signing_identity: ""
          - name: Windows portable
            artifact_group: windows-portable
            platform: windows-latest
            rust_targets: ""
            build_args: '["--no-bundle"]'
            expected_artifacts: '["src-tauri/target/release/*.exe"]'
            artifact_names: '["tauri-ui-smoke-v__VERSION__-windows-x64-portable.exe"]'
            signing_identity: ""
          - name: macOS Apple Silicon DMG
            artifact_group: macos-apple-silicon
            platform: macos-latest
            rust_targets: aarch64-apple-darwin
            build_args: '["--target","aarch64-apple-darwin","--bundles","dmg"]'
            expected_artifacts: '["src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg"]'
            artifact_names: '["tauri-ui-smoke-v__VERSION__-macos-apple-silicon.dmg"]'
            signing_identity: "-"
          - name: macOS Intel DMG
            artifact_group: macos-intel
            platform: macos-latest
            rust_targets: x86_64-apple-darwin
            build_args: '["--target","x86_64-apple-darwin","--bundles","dmg"]'
            expected_artifacts: '["src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg"]'
            artifact_names: '["tauri-ui-smoke-v__VERSION__-macos-intel.dmg"]'
            signing_identity: "-"
          - name: Linux packages
            artifact_group: linux-x64
            platform: ubuntu-22.04
            rust_targets: ""
            build_args: '["--bundles","appimage,deb,rpm"]'
            expected_artifacts: '["src-tauri/target/release/bundle/appimage/*.AppImage","src-tauri/target/release/bundle/deb/*.deb","src-tauri/target/release/bundle/rpm/*.rpm"]'
            artifact_names: '["tauri-ui-smoke-v__VERSION__-linux-x64.AppImage","tauri-ui-smoke-v__VERSION__-linux-x64.deb","tauri-ui-smoke-v__VERSION__-linux-x64.rpm"]'
            signing_identity: ""
    env:
      CREATE_TAURI_UI_TAURI_BUILD_ARGS: ${{ matrix.build_args }}
      CREATE_TAURI_UI_EXPECT_ARTIFACTS: ${{ matrix.expected_artifacts }}
      CREATE_TAURI_UI_ARTIFACT_NAMES: ${{ matrix.artifact_names }}
      CREATE_TAURI_UI_ARTIFACT_OUTPUT_DIR: ${{ github.workspace }}/release-assets
      CREATE_TAURI_UI_ARTIFACT_VERSION: ${{ needs.release-state.outputs.version }}
      CREATE_TAURI_UI_ARTIFACT_APP_NAME: tauri-ui-smoke
      APPLE_SIGNING_IDENTITY: ${{ matrix.signing_identity }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Generate and build Vite smoke app
        run: bun run test:create-tauri-ui:full -- vite

      - name: Store release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.artifact_group }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Release package
    needs:
      - release-state
      - prepublish-smoke
    if: |
      always() &&
      needs.release-state.result == 'success' &&
      (needs.prepublish-smoke.result == 'success' || needs.prepublish-smoke.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check package types
        run: bun run --cwd packages/create-tauri-ui check-types

      - name: Build package
        run: bun run --cwd packages/create-tauri-ui build

      - name: Test release workflow variants
        run: bun run test:create-tauri-ui:workflow

      - name: Smoke test representative templates
        run: bun run test:create-tauri-ui:release

      - name: Create Release PR or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: bun run release
          version: bun run version-packages
          title: "chore: release"
          commit: "chore: release"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure GitHub release exists
        id: release_meta
        if: needs.release-state.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./packages/create-tauri-ui/package.json').version")
          TAG="create-tauri-ui@$VERSION"
          TITLE="v$VERSION"

          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "No release tag created in this run. Skipping GitHub release creation."
            exit 0
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE"
          else
            gh release create "$TAG" --title "$TITLE" --generate-notes
          fi

          RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq '.id')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

      - name: Download native release assets
        if: needs.release-state.outputs.is_release == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: Attach native assets to GitHub release
        if: needs.release-state.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload '${{ steps.release_meta.outputs.tag }}' release-assets/* --clobber
